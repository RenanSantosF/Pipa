name: Android APK (debug)

# Gera o APK de teste a cada push. Saídas:
#  - Release "apk-latest" (baixar direto pelo celular, na aba Releases do GitHub)
#  - Artifact "pipa-debug-apk"
#  - Branch "apk-builds" (só o APK do último build)
on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-android-v1

      - name: Baixar Godot e templates de exportação
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL "${BASE}/Godot_v${V}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          mv /tmp/godot_bin/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL "${BASE}/Godot_v${V}_export_templates.tpz" -o /tmp/templates.tpz
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TPL_DIR"
          # Extrai só o necessário para Android (o pacote completo tem >1 GB).
          unzip -q /tmp/templates.tpz "templates/android_*" "templates/version.txt" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TPL_DIR"/
          ls -la "$TPL_DIR"
          rm -rf /tmp/tpl /tmp/templates.tpz /tmp/godot.zip /tmp/godot_bin

      - name: Configurar exportação Android
        run: |
          set -euo pipefail
          # Chave FIXA do repositório: todo APK novo instala por cima do anterior.
          cp android/debug.keystore ~/debug.keystore
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"${SDK}\""
              echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
              echo "export/android/debug_keystore = \"${HOME}/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > ~/.config/godot/$f
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${HOME}/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Importar projeto (valida scripts)
        run: |
          set -uo pipefail
          timeout 600 ~/godot/godot --headless --path . --import 2>&1 | tee import.log || true
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource" import.log; then
            echo "::error::Erros de script/recurso na importação (veja o log acima)"
            exit 1
          fi

      - name: Teste automático da física da pipa
        run: |
          set -uo pipefail
          timeout 600 ~/godot/godot --headless --path . --fixed-fps 60 -- --autotest 2>&1 | tee autotest.log || true
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script" autotest.log; then
            echo "::error::Erros de script durante a execução"
            exit 1
          fi
          grep -q "AUTOTEST PASS" autotest.log || { echo "::error::Autotest falhou"; exit 1; }
          # Mesmo teste com a física do celular (qualidade BAIXA: 30 Hz).
          timeout 600 ~/godot/godot --headless --path . --fixed-fps 60 -- --autotest --quality=0 2>&1 | tee autotest_low.log || true
          grep -q "AUTOTEST PASS" autotest_low.log || { echo "::error::Autotest (qualidade baixa) falhou"; exit 1; }
          # Gestos (toques sintéticos).
          timeout 120 ~/godot/godot --headless --path . --fixed-fps 60 -- --gestureprobe 2>&1 | tee gestures.log || true
          grep -q "GESTOS OK" gestures.log || { echo "::error::Teste de gestos falhou"; exit 1; }

      - name: Capturas de tela renderizadas (Vulkan por software)
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers xvfb > /dev/null
          mkdir -p build/shots && touch build/.gdignore
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 600 ~/godot/godot --path . \
            --rendering-driver vulkan --rendering-method mobile --resolution 1280x720 -- --screenshots 2>&1 | tee shots.log || true
          if [ -z "$(ls build/shots 2>/dev/null)" ]; then
            echo "Vulkan falhou; tentando OpenGL (Compatibility)"
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 600 ~/godot/godot --path . \
              --rendering-driver opengl3 --rendering-method gl_compatibility --resolution 1280x720 -- --screenshots 2>&1 | tee -a shots.log || true
          fi
          ls -la build/shots || true
          if grep -nE "SCRIPT ERROR|Parse Error" shots.log; then
            echo "::error::Erros de script no jogo normal (veja shots.log)"
            exit 1
          fi

      - name: Exportar APK
        run: |
          set -uo pipefail
          mkdir -p build
          timeout 900 ~/godot/godot --headless --path . --export-debug "Android" build/pipa-debug.apk 2>&1 | tee export.log || true
          test -f build/pipa-debug.apk || { echo "::error::APK não gerado"; exit 1; }
          ls -la build

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7

      - name: Artifact do APK
        uses: actions/upload-artifact@v4
        with:
          name: pipa-debug-apk
          path: build/pipa-debug.apk
          retention-days: 14

      - name: Publicar release "apk-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          SHORT="${GITHUB_SHA::7}"
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest build/pipa-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK de teste — ${GITHUB_REF_NAME} @ ${SHORT}" \
            --notes "Build automático (debug) do commit ${GITHUB_SHA}. Instale o pipa-debug.apk no Android (permita 'fontes desconhecidas')."

      - name: Publicar na branch apk-builds
        run: |
          set -euo pipefail
          mkdir /tmp/apkbranch && cp build/pipa-debug.apk /tmp/apkbranch/
          mkdir -p /tmp/apkbranch/shots /tmp/apkbranch/logs
          cp build/shots/*.png /tmp/apkbranch/shots/ 2>/dev/null || true
          cp *.log /tmp/apkbranch/logs/ 2>/dev/null || true
          cd /tmp/apkbranch
          echo "commit=${GITHUB_SHA}" > BUILD_INFO.txt
          echo "branch=${GITHUB_REF_NAME}" >> BUILD_INFO.txt
          date -u +"built=%Y-%m-%dT%H:%M:%SZ" >> BUILD_INFO.txt
          git init -q -b apk-builds
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-builds
